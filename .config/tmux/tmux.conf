set -g mouse on

set -ga terminal-features "*:hyperlinks" # macOS Terminal does not support them but it does not seem to hurt either

set-option -g status-position top

set -g @catppuccin_flavor "frappe"
run ~/.config/tmux/themes/catppuccin/catppuccin.tmux

if-shell "test -f ~/.config/tmux/tmux.conf.local" "source-file ~/.config/tmux/tmux.conf.local"
